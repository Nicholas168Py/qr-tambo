<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Sistema de Asistencia QR para Clases de Baile - QR Tambo" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>QR Tambo</title>
    <meta name="build-timestamp" content="__BUILD_TIMESTAMP__" />
    <script>
      (function () {
        var buildTimestamp = document.querySelector('meta[name="build-timestamp"]')?.content;
        if (!buildTimestamp) return;
        var lastBuild = localStorage.getItem('qr_tambo_build');
        if (lastBuild && lastBuild !== buildTimestamp) {
          // New deployment detected - clear caches and force reload
          if ('caches' in window) {
            caches.keys().then(function (names) {
              names.forEach(function (name) { caches.delete(name); });
            });
          }
          localStorage.removeItem('qr_tambo_build');
          sessionStorage.clear();
          window.location.reload(true);
          return;
        }
        localStorage.setItem('qr_tambo_build', buildTimestamp);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
